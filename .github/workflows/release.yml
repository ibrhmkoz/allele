# Every push to main runs the checks, then releases if the commits since
# the last tag ask for it (internal/nextversion: a "Release:" trailer, or
# patch for any change beyond docs/ and Markdown).
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: haskell-actions/setup@v2
        id: haskell
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.18.2.0"
          cabal-update: true
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            build/dist-newstyle
          key: cabal-${{ runner.os }}-${{ steps.haskell.outputs.ghc-version }}-${{ hashFiles('build/allele-build.cabal') }}
          restore-keys: |
            cabal-${{ runner.os }}-${{ steps.haskell.outputs.ghc-version }}-
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      # allele mutates the lines this push changed.
      - run: BASE=${{ github.event.before }} ./shake.sh ci

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: next
        run: echo "tag=$(go run ./internal/nextversion)" >> "$GITHUB_OUTPUT"
      - if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "allele $TAG"
          git push origin "$TAG"
      - if: steps.next.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
