name: ci

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: make ci exactly, twice
        run: |
          make ci BASE=4bf5dc9 2>&1 | tail -5 || true
          echo "== again"
          make ci BASE=4bf5dc9 2>&1 | tail -5 || true
          echo "== with -no-cache"
          go run ./cmd/allele -no-cache -strict -diff 4bf5dc9 ./... 2>&1 | tail -4 || true
