name: ci

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the release job's mutate, with -v and -json
        run: |
          go run ./cmd/allele -v -strict -json -diff 4bf5dc9 ./... > /tmp/out.json 2> /tmp/log.txt || true
          grep '"line":27' /tmp/out.json | grep gotest
          grep -E 'pkg/gotest' /tmp/log.txt | head
          grep -iE 'flaky|recheck|confirm|TestBuildOverlay' /tmp/log.txt | head -20
