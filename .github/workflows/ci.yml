name: ci

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: haskell-actions/setup@v2
        id: haskell
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.18.2.0"
          cabal-update: true
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            build/dist-newstyle
          key: cabal-${{ runner.os }}-${{ steps.haskell.outputs.ghc-version }}-${{ hashFiles('build/allele-build.cabal') }}
          restore-keys: |
            cabal-${{ runner.os }}-${{ steps.haskell.outputs.ghc-version }}-
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      # allele mutates the lines the pull request changes.
      - run: BASE=origin/${{ github.base_ref }} ./shake.sh ci
